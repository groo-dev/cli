[package]
name = "groo-cli"
version = "0.1.0"
edition = "2024"
description = "A CLI tool for managing and running dev servers in monorepos"
license = "MIT"

[[bin]]
name = "groo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
console = "0.16.1"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
libc = "0.2.178"
open = "5.3.3"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full", "process", "signal"] }
futures = "0.3"
toml = "0.9.8"
walkdir = "2.5.0"

# Auth & Pad integration
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
sha1 = "0.10.6"
hmac = "0.12.1"
data-encoding = "2.9"
rand = "0.8"
base64 = "0.22"
rpassword = "7.4"
url = "2.5"
glob = "0.3"
atty = "0.2"
urlencoding = "2.1"
mime_guess = "2.0"
http = "1.2"
chrono = "0.4"
uuid = { version = "1.19", features = ["v4"] }

# TUI (used by pass and pad)
ratatui = "0.30"
crossterm = "0.29"
arboard = "3.6"

# Ops encryption (RSA-OAEP + AES-GCM hybrid)
rsa = { version = "0.9", features = ["sha2"] }
